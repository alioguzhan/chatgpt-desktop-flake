name: Update ChatGPT

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-chatgpt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Check and update package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Read official package metadata
        run: nix run .#update

      - name: Detect an update
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- package/source.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify updated package
        if: steps.changes.outputs.changed == 'true'
        run: |
          nix flake check --no-build
          nix build .#chatgpt --no-link

      - name: Commit and push update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          version=$(nix eval --raw .#chatgpt.version)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package/source.json
          git commit -m "chore(package): update chatgpt to $version"
          git push
